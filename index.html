<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Store Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav>

  <div class="logo">TechStore Pro</div>

  <div class="right-nav">

    <button onclick="toggleDarkMode()">🌙</button>

    <div class="cart-icon" onclick="toggleCart()">
      🛒 <span id="cartCount">0</span>
    </div>

  </div>

</nav>

<!-- HERO -->
<section class="hero">

  <div class="hero-text">
    <h1>Next Gen Tech Products</h1>
    <p>Premium quality gadgets at best price</p>
    <button onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
  </div>

  <div class="hero-image">
    <img src="earbuds.jpg" alt="Product">
  </div>

</section>
<input type="text" id="search" placeholder="Search product...">
<!-- PRODUCTS -->
<section class="products" id="products">

  <h2>Our Products</h2>

  <div class="product-grid">

    <div class="product-card">
      <img src="earbuds.jpg">
      <h3>Wireless Earbuds</h3>
      <p>799 TK</p>
      <button onclick="addToCart('Earbuds', 799)">Add to Cart</button>
    </div>

    <div class="product-card">
      <img src="watch.jpg">
      <h3>Smart Watch</h3>
      <p>1499 TK</p>
      <button onclick="addToCart('Watch', 1499)">Add to Cart</button>
    </div>

  </div>

</section>

<!-- CART SIDEBAR -->
<div id="cartSidebar" class="cart-sidebar">
<input type="text" id="cusName" placeholder="Your Name">
<input type="text" id="cusAddress" placeholder="Your Address">
  <h2>Your Cart 🛒</h2>

  <div id="cartItems"></div>

  <h3 id="total">Total: 0 TK</h3>

  <button class="checkout-btn" onclick="checkoutWhatsApp()">
    Checkout 📲
  </button>

  <button onclick="toggleCart()">Close ❌</button>

</div>
<div class="mobile-cart">
  🛒 Cart (<span id="cartCountMobile">0</span>)
</div>

<!-- FLOAT CART BUTTON -->
<button class="open-cart" onclick="toggleCart()">🛒</button>

<script src="script.js"></script>

</body>
</html>
