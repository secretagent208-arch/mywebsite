<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tech Store</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navbar -->

  <nav>

    <div class="logo">
      TechStore
    </div>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

  </nav>



  <!-- Hero Section -->

  <section class="hero">

    <div class="hero-text">

      <h1>Next Generation Earbuds</h1>

      <p>
        Premium sound quality with modern design.
      </p>

      <button>
        Shop Now
      </button>

    </div>


    <div class="hero-image">

      <img src="earbuds.jpg" alt="Earbuds">

    </div>

  </section>



  <!-- Products Section -->

<section class="products" id="products">

    <h2>Our Products</h2>

    <div class="product-grid">


      <div class="product-card">

        <img src="earbuds.jpg" alt="">

        <h3>Wireless Earbuds</h3>

        <p>799 TK</p>

        <button>Add to Cart</button>

      </div>



      <div class="product-card">

        <img src="watch.jpg" alt="">

        <h3>Smart Watch</h3>

        <p>1499 TK</p>

        <button>Add to Cart</button>

      </div>

    </div>

  </section>
<script src="script.js"></script>
</body>

</html>
